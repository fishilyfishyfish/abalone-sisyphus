<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>아발론</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>아발론</h1>
    <form id="setup" class="setup">
      <label>배치
        <select id="layout">
          <option value="belgian" selected>벨지안 데이지</option>
          <option value="standard">표준</option>
          <option value="german">저먼 데이지</option>
        </select>
      </label>
      <label>내 색
        <select id="human">
          <option value="black" selected>흑 (선)</option>
          <option value="white">백 (후)</option>
          <option value="both">둘 다 (2인)</option>
        </select>
      </label>
      <label>수 제한
        <input id="limit" type="number" min="0" max="2000" step="1" value="200" inputmode="numeric">
      </label>
      <button type="submit" class="btn">새 대국</button>
    </form>
  </header>

  <main class="layout">
    <section class="board-wrap" aria-label="게임 판">
      <svg id="board" viewBox="0 0 100 100" role="img" aria-label="아발론 판"></svg>
      <p id="hint" class="hint" aria-live="polite"></p>
    </section>

    <aside class="panel">
      <div id="banner" class="banner" hidden></div>

      <div class="scores">
        <div class="score" data-color="black">
          <span class="who"><i class="dot black"></i>흑<span class="tag" id="tag-black"></span></span>
          <span class="pushed" id="pushed-black" aria-label="흑이 밀어낸 구슬"></span>
        </div>
        <div class="score" data-color="white">
          <span class="who"><i class="dot white"></i>백<span class="tag" id="tag-white"></span></span>
          <span class="pushed" id="pushed-white" aria-label="백이 밀어낸 구슬"></span>
        </div>
      </div>

      <div class="status">
        <span id="turn"></span>
        <span id="ply" class="muted"></span>
      </div>

      <div class="actions">
        <button id="undo" class="btn">무르기</button>
        <button id="clear" class="btn ghost">선택 해제</button>
      </div>

      <h2>기보</h2>
      <ol id="moves" class="moves"></ol>

      <details class="feat">
        <summary>엔진 특징값 (현재 국면)</summary>
        <table id="features"></table>
      </details>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
