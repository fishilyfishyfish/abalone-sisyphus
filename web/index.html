<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>아발론</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>아발론</h1>
    <form id="setup" class="setup">
      <label>배치
        <select id="layout">
          <option value="belgian" selected>벨지안 데이지</option>
          <option value="standard">표준</option>
          <option value="german">저먼 데이지</option>
        </select>
      </label>
      <label>내 색
        <select id="human">
          <option value="black" selected>흑 (선)</option>
          <option value="white">백 (후)</option>
          <option value="both">둘 다 (2인)</option>
        </select>
      </label>
      <label>컴퓨터
        <select id="level">
          <option value="random">아주 쉬움 (아무 데나)</option>
          <option value="easy" selected>쉬움</option>
          <option value="normal">보통</option>
          <option value="hard">어려움</option>
          <option value="expert">아주 어려움 (4초)</option>
        </select>
      </label>
      <label>조작
        <select id="control">
          <option value="swipe" selected>쓸고 화살표 누르기</option>
          <option value="tap">하나씩 누르고 칸 누르기</option>
          <option value="ends">첫 돌 · 끝점 누르기</option>
        </select>
      </label>
      <label class="check"><input id="friendly" type="checkbox" checked> 친절 모드</label>
      <label class="check" title="어려움·아주 어려움: 내가 생각하는 동안 컴퓨터도 미리 생각해 둬요"><input id="ponder" type="checkbox" checked> 내 차례에도 컴퓨터가 생각</label>
      <label>수 제한
        <input id="limit" type="number" min="0" max="2000" step="1" value="200" inputmode="numeric">
      </label>
      <button type="submit" class="btn">새 대국</button>
    </form>
  </header>

  <main class="layout">
    <section class="board-wrap" aria-label="게임 판">
      <svg id="board" viewBox="0 0 100 100" role="img" aria-label="아발론 판"></svg>
      <p id="msg" class="msg" aria-live="polite"></p>
    </section>

    <aside class="panel">
      <div id="banner" class="banner" hidden></div>

      <div class="scores">
        <div class="score" data-color="black">
          <span class="who"><i class="dot black"></i>흑<span class="tag" id="tag-black"></span></span>
          <span class="pushed-label">밀어낸 구슬 <b id="count-black"></b></span>
          <span class="pushed" id="pushed-black" aria-label="흑이 밀어낸 구슬"></span>
        </div>
        <div class="score" data-color="white">
          <span class="who"><i class="dot white"></i>백<span class="tag" id="tag-white"></span></span>
          <span class="pushed-label">밀어낸 구슬 <b id="count-white"></b></span>
          <span class="pushed" id="pushed-white" aria-label="백이 밀어낸 구슬"></span>
        </div>
      </div>

      <div class="status">
        <span id="turn" class="turn"></span>
        <span id="ply" class="muted"></span>
      </div>

      <div class="actions">
        <button id="undo" class="btn">↶ 무르기</button>
        <button id="hint" class="btn hint">힌트</button>
        <button id="clear" class="btn ghost">선택 해제</button>
      </div>

      <section id="feedback" class="feedback" hidden>
        <h3>방금 둔 수 <span id="fb-grade" class="grade"></span></h3>
        <ul id="fb-sentences"></ul>
      </section>

      <button id="review-btn" class="btn ghost wide">복기하기 (수마다 실수 등급과 설명)</button>
      <button id="record-btn" class="btn ghost wide">기보 저장 · 불러오기</button>

      <details class="help">
        <summary>어떻게 해요?</summary>
        <ul id="help-list"></ul>
      </details>

      <details class="stats" id="stats">
        <summary>배치별 승률</summary>
        <h3>컴퓨터끼리 둔 결과</h3>
        <p class="muted" id="stats-note">불러오는 중…</p>
        <div id="stats-engine"></div>
        <h3>내 기록 <small class="muted">(이 기기에만 저장돼요)</small></h3>
        <div id="stats-mine"></div>
        <button id="stats-reset" class="btn ghost">내 기록 지우기</button>
      </details>

      <div id="play-only">
      <h2>기보</h2>
      <ol id="moves" class="moves"></ol>
      </div>

      <section id="review" class="review" hidden>
        <div class="review-head">
          <h2>복기</h2>
          <span id="rv-progress" class="muted"></span>
        </div>
        <ol id="rv-list" class="rv-list"></ol>
        <div class="rv-nav">
          <button id="rv-prev" class="btn ghost">◀ 이전 수</button>
          <button id="rv-next" class="btn ghost">다음 수 ▶</button>
        </div>
        <div class="rv-box explain">
          <h3>설명</h3>
          <ul id="rv-sentences"></ul>
        </div>
        <div class="rv-box engine">
          <h3>엔진 판단</h3>
          <div id="rv-engine"></div>
        </div>
        <button id="rv-exit" class="btn wide">대국으로 돌아가기</button>
      </section>

      <details class="feat" id="engine">
        <summary>엔진 판단</summary>
        <p class="engine-line" id="eval-line"></p>
        <table id="features"></table>
        <p class="engine-line" id="search-line"></p>
      </details>
    </aside>
  </main>

  <dialog id="warn" class="warn">
    <h2>잠깐!</h2>
    <p id="warn-grade" class="warn-grade"></p>
    <ul id="warn-sentences"></ul>
    <div class="warn-actions">
      <button id="warn-cancel" class="btn">다시 생각할래요</button>
      <button id="warn-hint" class="btn hint">힌트 보기</button>
      <button id="warn-play" class="btn ghost">그래도 둘래요</button>
    </div>
  </dialog>

  <dialog id="record" class="warn record">
    <h2>기보</h2>
    <p class="muted">지금 대국의 기보예요. 다른 기보를 붙여 넣거나 파일을 열어서 불러올 수도 있어요.</p>
    <textarea id="record-text" rows="12" spellcheck="false" autocomplete="off" aria-label="기보 내용"></textarea>
    <p id="record-msg" class="record-msg" aria-live="polite"></p>
    <div class="warn-actions">
      <button id="record-save" class="btn">파일로 저장</button>
      <button id="record-copy" class="btn ghost">복사</button>
      <label class="btn ghost file">파일 열기<input id="record-file" type="file" accept=".txt,.abl,.pgn,text/plain" hidden></label>
      <button id="record-load" class="btn hint">불러오기</button>
      <button id="record-close" class="btn ghost">닫기</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
